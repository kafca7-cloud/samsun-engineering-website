<svg class="map-svg" viewBox="0 0 640 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="㈜삼선엔지니어링 약도: 좌수영로 남측, 농협주유소 옆, 여수세무서 맞은편, 여천역 북동쪽" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#1c1c1c" stroke-width="1"/></pattern>
    <filter id="pinShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>
  <rect width="640" height="440" fill="#121212"/>
  <rect width="640" height="440" fill="url(#grid)"/>

  <!-- 하천 (신풍천) -->
  <path d="M0 268 C 120 262, 220 286, 330 280 S 540 262, 640 272" fill="none" stroke="#1f2a33" stroke-width="10" stroke-linecap="round"/>
  <text class="sub" x="590" y="258" fill="#3d5466" font-size="12" font-weight="600" text-anchor="end">신풍천</text>

  <!-- 철도 (전라선) -->
  <path d="M0 338 L640 322" fill="none" stroke="#2c2c2c" stroke-width="10"/>
  <path d="M0 338 L640 322" fill="none" stroke="#6d6d6d" stroke-width="3" stroke-dasharray="16 12"/>
  <text class="sub" x="628" y="312" fill="#7a7a7a" font-size="12" font-weight="600" text-anchor="end">전라선</text>

  <!-- 시청로 (남북) -->
  <path d="M112 0 L120 150 L116 440" fill="none" stroke="#3a3a3a" stroke-width="14" stroke-linecap="round"/>
  <text class="sub" transform="translate(103 395) rotate(-90)" fill="#8a8a8a" font-size="13" font-weight="700">시청로</text>

  <!-- 좌수영로: 북서(석창 방면)에서 내려와 본사 앞을 지나 동쪽으로 -->
  <path d="M60 0 C 140 80, 230 160, 322 176 S 500 184, 640 192" fill="none" stroke="#2a2a2a" stroke-width="26" stroke-linecap="round"/>
  <path d="M60 0 C 140 80, 230 160, 322 176 S 500 184, 640 192" fill="none" stroke="#FFC400" stroke-width="16" stroke-linecap="round"/>
  <path d="M120 150 L322 176" fill="none" stroke="#3a3a3a" stroke-width="12" stroke-linecap="round"/>
  <text class="road" x="445" y="172" fill="#FFC400" font-size="15" font-weight="800" letter-spacing="1">좌수영로</text>
  <text class="sub" x="138" y="52" fill="#bdbdbd" font-size="12" font-weight="600">↖ 석창 · 주삼 방면</text>
  <text class="sub" x="634" y="214" fill="#bdbdbd" font-size="12" font-weight="600" text-anchor="end">여수 시내 방면 →</text>

  <!-- 랜드마크 -->
  <g class="lbl" fill="#e6e6e6" font-size="13" font-weight="600">
    <circle cx="250" cy="130" r="4.5" fill="#9a9a9a"/><text x="262" y="134">여수세무서</text>
    <circle cx="284" cy="206" r="4.5" fill="#9a9a9a"/><text class="nh" x="232" y="232">농협주유소</text><text class="nh-m" x="272" y="232" text-anchor="end">농협주유소</text>
    <g class="sub2"><circle cx="140" cy="190" r="4.5" fill="#9a9a9a"/><text x="146" y="214">HD현대오일뱅크</text></g>
    <rect x="178" y="352" width="30" height="12" fill="#9a9a9a" rx="1"/><text x="216" y="363">여천역</text>
    <g class="sub2"><circle cx="458" cy="206" r="4.5" fill="#9a9a9a"/><text x="470" y="226">그린빌라장</text></g>
  </g>

  <!-- 본사 핀 -->
  <g filter="url(#pinShadow)">
    <path d="M330 232 c-14 -18 -22 -29 -22 -41 a22 22 0 1 1 44 0 c0 12 -8 23 -22 41z" fill="#FFC400"/>
    <circle cx="330" cy="191" r="8" fill="#111"/>
  </g>
  <g>
    <rect class="co-bg" x="262" y="238" width="136" height="30" fill="#FFC400"/>
    <text class="co" x="330" y="259" fill="#111" font-size="15" font-weight="800" text-anchor="middle" letter-spacing="0.5">㈜삼선엔지니어링</text>
  </g>

  <!-- 방위 · 축척 -->
  <g transform="translate(596 44)" fill="#bdbdbd"><path d="M0 -18 L8 10 L0 4 L-8 10 Z" fill="#FFC400"/><text y="28" font-size="11" font-weight="700" text-anchor="middle">N</text></g>
  <g class="sub" transform="translate(24 404)"><rect width="90" height="4" fill="#bdbdbd"/><rect width="45" height="4" fill="#4a4a4a"/><text y="20" fill="#9a9a9a" font-size="11" font-weight="600">약 250 m</text></g>
  <text class="sub" x="616" y="420" fill="#555" font-size="10" text-anchor="end">약도 — 도로 형태·축척은 단순화한 것입니다</text>
</svg>
