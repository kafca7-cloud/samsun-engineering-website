<svg class="map-svg" viewBox="405 0 760 492" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="㈜삼선엔지니어링 약도: 좌수영로 남측, 북서쪽 사거리(주삼동 방면)에서 동쪽으로 약 150m, 남서쪽에 여천역, 동쪽에 현대오일뱅크">
  <defs>
    <pattern id="mapGrid" width="50" height="50" patternUnits="userSpaceOnUse"><path d="M50 0H0V50" fill="none" stroke="#1b1b1b" stroke-width="1"/></pattern>
    <filter id="pinShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/></filter>
  </defs>
  <rect x="405" y="0" width="760" height="492" fill="#121212"/>
  <rect x="405" y="0" width="760" height="492" fill="url(#mapGrid)"/>

  <!-- 하천: 쌍봉천 -->
  <path d="M340 300 C 420 318, 520 335, 600 340 C 700 355, 800 372, 900 372 C 930 368, 955 352, 985 346" fill="none" stroke="#1e2e3a" stroke-width="9" stroke-linecap="round"/>
  <text class="sub" x="604" y="378" fill="#4a6a80" font-size="15" font-weight="600">쌍봉천</text>

  <!-- 철도: 전라선 -->
  <path d="M340 332 C 420 350, 520 382, 600 400 C 700 412, 800 420, 900 430 C 1000 440, 1100 450, 1232 460" fill="none" stroke="#2a2a2a" stroke-width="10"/>
  <path d="M340 332 C 420 350, 520 382, 600 400 C 700 412, 800 420, 900 430 C 1000 440, 1100 450, 1232 460" fill="none" stroke="#777" stroke-width="3" stroke-dasharray="16 12"/>
  <text class="sub" x="1040" y="432" fill="#8a8a8a" font-size="14" font-weight="600">전라선</text>

  <!-- 보조 도로 (가는 선) -->
  <g fill="none" stroke="#333" stroke-width="5" stroke-linecap="round">
    <path d="M622 128 C 660 124, 720 128, 780 142 C 830 154, 870 140, 930 100"/>
    <path d="M745 262 C 760 240, 800 215, 840 190 C 880 165, 905 150, 930 140"/>
    <path d="M750 262 C 790 256, 840 258, 880 300 L 900 322"/>
  </g>

  <!-- 주요 도로: 주삼동 방면(북) · 여천역 방면(남) -->
  <g fill="none" stroke-linecap="round">
    <path d="M604 282 C 596 240, 600 200, 610 170 C 622 130, 634 90, 650 40 L 672 0" stroke="#262626" stroke-width="20"/>
    <path d="M604 282 C 596 240, 600 200, 610 170 C 622 130, 634 90, 650 40 L 672 0" stroke="#454545" stroke-width="12"/>
    <path d="M604 282 C 590 310, 575 340, 568 380 C 562 420, 560 460, 560 492" stroke="#262626" stroke-width="18"/>
    <path d="M604 282 C 590 310, 575 340, 568 380 C 562 420, 560 460, 560 492" stroke="#454545" stroke-width="10"/>
  </g>

  <!-- 좌수영로 (본사 앞 간선도로) -->
  <path d="M425 0 C 470 70, 540 190, 604 282 C 660 300, 760 318, 900 340 C 1000 356, 1100 366, 1232 376" fill="none" stroke="#2a2a2a" stroke-width="28" stroke-linecap="round"/>
  <path d="M425 0 C 470 70, 540 190, 604 282 C 660 300, 760 318, 900 340 C 1000 356, 1100 366, 1232 376" fill="none" stroke="#FFC400" stroke-width="17" stroke-linecap="round"/>
  <text class="road" x="1060" y="332" fill="#FFC400" font-size="20" font-weight="800" letter-spacing="1" text-anchor="middle">좌수영로</text>
  <text class="sub" x="486" y="64" fill="#bdbdbd" font-size="14" font-weight="600">↖ 석창 방면</text>
  <text class="sub" x="690" y="38" fill="#bdbdbd" font-size="14" font-weight="600">주삼동 방면 ↑</text>

  <!-- 랜드마크 -->
  <g class="lbl" fill="#e6e6e6" font-size="17" font-weight="600">
    <g class="sub2"><circle cx="607" cy="147" r="5" fill="#9a9a9a"/><text x="640" y="168">주삼동 주민센터</text></g>
    <circle cx="990" cy="357" r="5" fill="#9a9a9a"/><text x="990" y="392" text-anchor="middle">현대오일뱅크</text>
    <rect x="622" y="403" width="30" height="13" fill="#9a9a9a"/><text x="660" y="446">여천역</text>
  </g>

  <!-- 본사 핀 (좌수영로 남측) -->
  <g filter="url(#pinShadow)">
    <path d="M765 333 c-15 -19 -24 -31 -24 -44 a24 24 0 1 1 48 0 c0 13 -9 25 -24 44z" fill="#FFC400"/>
    <circle cx="765" cy="289" r="9" fill="#111"/>
  </g>
  <rect class="co-bg" x="688" y="341" width="154" height="32" fill="#FFC400"/>
  <text class="co" x="765" y="363" fill="#111" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="0.5">㈜삼선엔지니어링</text>

  <!-- 방위 -->
  <g transform="translate(1125 44)" fill="#bdbdbd"><path d="M0 -18 L8 10 L0 4 L-8 10 Z" fill="#FFC400"/><text y="30" font-size="12" font-weight="700" text-anchor="middle">N</text></g>
  <text class="sub" x="1152" y="480" fill="#555" font-size="11" text-anchor="end">약도 — 도로 형태는 단순화한 것입니다</text>
</svg>
